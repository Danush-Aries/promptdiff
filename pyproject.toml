[project]
name = "promptdiff"
version = "0.1.0"
description = "pytest for LLM prompts — a regression-testing harness that catches when a prompt or model change silently regresses outputs. Snapshot/baseline diffing, offline-by-default VCR cassettes, native pytest ergonomics. Free, hermetic CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = ["llm", "prompt-engineering", "testing", "regression", "pytest", "snapshot",
            "evals", "openai", "anthropic", "ai", "cassettes", "vcr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.30"]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
promptdiff = "promptdiff.cli:app"

[project.entry-points.pytest11]
promptdiff = "promptdiff.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Danush-Aries/promptdiff"
Repository = "https://github.com/Danush-Aries/promptdiff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.promptdiff]
cassette_dir = "tests/cassettes"
record_mode = "none"
